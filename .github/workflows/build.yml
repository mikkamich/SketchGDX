name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew :app:assembleMinApi21Debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SketchGDX-debug
          path: app/build/outputs/apk/minApi21/debug/*.apk
